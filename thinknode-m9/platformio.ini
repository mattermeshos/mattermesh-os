[platformio]
default_envs = thinknode-m9-free

[ui_hardware]
extra_scripts = pre:tools/ui_build_info.py
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
build_flags =
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D ARDUINO_USB_MODE=1
 -D BOARD_HAS_PSRAM
lib_extra_dirs = hardware/lib
lib_ldf_mode = chain+
build_src_filter = +<*> -<.git/> -<.svn/>
lib_deps =
 adafruit/Adafruit GFX Library @ 1.11.11
 adafruit/Adafruit BusIO @ 1.17.0
monitor_speed = 115200

; Mesh/radio base shared by the T-Deck Plus images below (not an image itself).
[mesh_base]
extends = ui_hardware
lib_extra_dirs =
 hardware/lib
lib_deps =
 ${ui_hardware.lib_deps}
 symlink://lib/mattermesh-core
 symlink://lib/mattermesh-ed25519
 jgromes/RadioLib @ 7.8.1
 rweather/Crypto @ 0.4.0
 densaugeo/base64 @ 1.4.0
 bblanchon/ArduinoJson @ 6.21.5
 https://github.com/ElectronicCats/CayenneLPP.git#1.5.0
 h2zero/NimBLE-Arduino @ 2.3.6
 bitbank2/PNGdec @ 1.1.6
 ; JPEG photos in the link viewer (src/services/link_viewer.cpp)
 bitbank2/JPEGDEC @ 1.8.4
build_flags =
 ${ui_hardware.build_flags}
 -D RADIOLIB_STATIC_ONLY=1
 -D RADIOLIB_GODMODE=1
 -I meshcore-base/lib/ed25519
 -D USE_SX1262
 -D LORA_SF=8
 -D LORA_FREQ=869.618
 -D LORA_BW=62.5
 -D LORA_CR=8
 -D LORA_TX_POWER=22
 -D MAX_GROUP_CHANNELS=32
 -D MAX_CONTACTS=1024


; Elecrow ThinkNode M9 (ESP32-S3-R8, 16 MB flash, octal PSRAM, LR1110, CH340 on the USB-C port: Serial is UART0).
[env:thinknode-m9]
extends = mesh_base
extra_scripts = pre:tools/ui_build_info.py
 pre:tools/ota_default_servers.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_unflags =
 -D USE_SX1262
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D ARDUINO_USB_MODE=1
build_flags =
 -fmacro-prefix-map=${PROJECT_DIR}/=/
 ${mesh_base.build_flags}
 -D USE_LR1110
 -D ARDUINO_USB_CDC_ON_BOOT=0
 -D ARDUINO_USB_MODE=0
 -D PNG_MAX_BUFFERED_PIXELS=16434

[env:thinknode-m9-free]
extends = env:thinknode-m9
