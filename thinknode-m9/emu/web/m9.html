<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ThinkNode M9 - MatterMesh OS emulator</title>
<style>
 html,body{margin:0;height:100%;background:#1b1b1d;overflow:hidden}
 body{display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
 /* The face is laid out in the photo's own pixels (366 x 555) and scaled to fit the window. */
 #face{position:relative;width:366px;height:555px;transform-origin:center;touch-action:none}
 #face img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
 #lcd{position:absolute;left:68px;top:62px;width:222px;height:167px;background:#000;image-rendering:auto}
 .k{position:absolute;border-radius:6px;-webkit-tap-highlight-color:transparent}
 .k.down{background:rgba(255,255,255,.28)}
 .k.on{box-shadow:inset 0 0 0 2px #4fc3f7;background:rgba(79,195,247,.18)}
 .k.lock{box-shadow:inset 0 0 0 2px #ffb74d;background:rgba(255,183,77,.22)}
 #glow{position:absolute;left:48px;top:330px;width:262px;height:162px;border-radius:14px;pointer-events:none;mix-blend-mode:screen;background:rgba(255,236,190,0)}
 #status{position:fixed;left:8px;bottom:6px;color:#888;font:12px system-ui}
</style>
</head>
<body>
<div id="face">
 <img src="skin.png" alt="" onerror="this.remove()">
 <canvas id="lcd" width="320" height="240"></canvas>
 <div id="glow"></div>
</div>
<div id="status">connecting...</div>
<script>
'use strict';
const face=document.getElementById('face'),lcd=document.getElementById('lcd'),ctx=lcd.getContext('2d'),glow=document.getElementById('glow'),status=document.getElementById('status');
function fit(){const s=Math.min(innerWidth/366,innerHeight/555);face.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();

// Keys in the photo's pixels. code: byte the M9 keyboard chip sends; hold: byte sent instead when held 0.6 s;
// repeat: sent again while held; ch/alt: the character and the one printed above it (alt / Sym layer).
const keys=[
 {x:60,y:270,w:40,h:40,code:0x81},             // big bubble: chats
 {x:100,y:257,w:34,h:31,code:0x82},            // home
 {x:100,y:292,w:34,h:32,code:0x83},            // small message box
 {x:223,y:257,w:34,h:31,code:0x86},            // back
 {x:223,y:292,w:34,h:34,code:0x84,hold:0x87},  // advert (held: GPS)
 {x:258,y:270,w:40,h:40,code:0x85},            // map
 {x:160,y:272,w:36,h:36,code:0x0D,hold:0xA3},  // D-pad centre: OK (held: unlock / hold action)
 {x:143,y:255,w:70,h:17,code:0xB5,repeat:true},{x:143,y:308,w:70,h:17,code:0xB6,repeat:true},
 {x:143,y:272,w:17,h:36,code:0xB4,repeat:true},{x:196,y:272,w:17,h:36,code:0xB7,repeat:true},
];
const col=i=>52+25.3*i,row=[333,373,413,453];
const add=(c,r,k,span=1)=>keys.push(Object.assign({x:col(c),y:row[r],w:25.3*span-1.3,h:36},k));
[...'qwertyuiop'].forEach((ch,i)=>add(i,0,{ch,alt:'#123()-_+@'[i]}));
[...'asdfghjkl'].forEach((ch,i)=>add(i,1,{ch,alt:'*456/:;"\''[i]}));
add(9,1,{code:0x08,repeat:true});              // del
add(0,2,{mod:'alt'});
[...'zxcvbnm'].forEach((ch,i)=>add(i+1,2,{ch,alt:'789?!,.'[i]}));
add(8,2,{ch:'$'});add(9,2,{code:0x0D});        // enter
add(1,3,{code:0x88});                          // triangle: menu
add(2,3,{ch:'0'});add(3,3,{mod:'shift'});add(4,3,{ch:' '},2);add(6,3,{ch:'&'});add(7,3,{mod:'sym'});
add(8,3,{code:0x90});                          // ctrl

// Modifiers: one tap = next key only, a second tap within 0.4 s = locked, one more tap = off.
const mods={shift:0,alt:0,sym:0},modEls={},modTap={};
function setMod(name,v){mods[name]=v;for(const el of modEls[name]||[]){el.classList.toggle('on',v===1);el.classList.toggle('lock',v===2);}}
function useMods(){for(const n in mods)if(mods[n]===1)setMod(n,0);}

function send(b){fetch('key?c='+b.toString(16).padStart(2,'0')).catch(()=>{});}
function keyByte(k){
 if(k.code!==undefined)return k.code;
 let c=(mods.alt||mods.sym)&&k.alt?k.alt:k.ch;
 if(mods.shift&&c>='a'&&c<='z')c=c.toUpperCase();
 return c.charCodeAt(0);
}
for(const k of keys){
 const el=document.createElement('div');el.className='k';
 Object.assign(el.style,{left:k.x+'px',top:k.y+'px',width:k.w+'px',height:k.h+'px'});face.appendChild(el);
 if(k.mod)(modEls[k.mod]=modEls[k.mod]||[]).push(el);
 let downAt=0,timer=0,holdTimer=0,held=false;
 const stop=()=>{clearTimeout(timer);clearInterval(timer);clearTimeout(holdTimer);};
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('down');downAt=performance.now();held=false;
  if(navigator.vibrate)navigator.vibrate(8);
  if(k.mod){const now=performance.now(),v=mods[k.mod];setMod(k.mod,v===1&&now-(modTap[k.mod]||0)<400?2:v?0:1);modTap[k.mod]=now;return;}
  if(k.hold!==undefined){holdTimer=setTimeout(()=>{held=true;send(k.hold);},600);return;}// decided at release / after 0.6 s
  send(keyByte(k));useMods();
  if(k.repeat)timer=setTimeout(()=>{timer=setInterval(()=>send(k.code),120);},400);
 });
 const up=e=>{
  if(!el.classList.contains('down'))return;el.classList.remove('down');stop();
  if(k.hold!==undefined&&!held&&e.type==='pointerup')send(k.code);
 };
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

// Screen: long poll of the raw RGB565 frame; the LCD and keyboard lights follow the emulated chips.
const img=ctx.createImageData(320,240);let seq=0;
async function frames(){
 for(;;){
  try{
   const r=await fetch('frame?since='+seq);
   if(r.status===200){
    const w=+r.headers.get('X-W'),h=+r.headers.get('X-H'),data=new Uint16Array(await r.arrayBuffer());
    let px=data;
    if(r.headers.get('X-Enc')==='rle'){px=new Uint16Array(w*h);for(let i=0,o=0;i<data.length;i+=2){px.fill(data[i+1],o,o+data[i]);o+=data[i];}}
    seq=+r.headers.get('X-Seq');
    if(lcd.width!==w||lcd.height!==h){lcd.width=w;lcd.height=h;}
    const out=w===img.width&&h===img.height?img:ctx.createImageData(w,h),d=out.data;
    for(let i=0,j=0;i<px.length;i++,j+=4){const c=px[i];d[j]=(c>>8&0xF8)|(c>>13);d[j+1]=(c>>3&0xFC)|(c>>9&3);d[j+2]=(c<<3&0xF8)|(c>>2&7);d[j+3]=255;}
    ctx.putImageData(out,0,0);
    const lv=+r.headers.get('X-Light');lcd.style.filter=`brightness(${lv?0.45+0.55*lv/16:0})`;// a dimmed LCD stays readable, as on the real panel
    glow.style.background=`rgba(255,236,190,${(+r.headers.get('X-Kbd'))/255*0.1})`;
   }
   status.textContent='';
  }catch(e){status.textContent='emulator not reachable, retrying...';await new Promise(f=>setTimeout(f,1000));}
 }
}
frames();
</script>
</body>
</html>
