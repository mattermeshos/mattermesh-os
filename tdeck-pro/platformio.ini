[platformio]
default_envs = mattermesh-free

[ui_hardware]
extra_scripts = pre:tools/ui_build_info.py
 pre:tools/ota_default_servers.py
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
build_flags =
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D ARDUINO_USB_MODE=1
 -D BOARD_HAS_PSRAM
 ; Makes "board/board.h" includable from lib/HynTouch (which needs the BOARD_TOUCH_*/LCD_*_SIZE macros,
 ; the same way T-Deck Max's build makes its external TDeckMaxBoard.h includable project-wide).
 -I src
 ; T-Deck Max/Plus strip the build machine home from __FILE__ strings here with
 ; -fmacro-prefix-map=${PROJECT_DIR}/=/, but PlatformIO passes that unquoted, so it breaks on any
 ; project path containing a space (as this one does). Not needed for a working build; left out here.
lib_ldf_mode = chain+
; quartznet.cpp (ASR v1) is host-only: no sim/ harness is included in this port (tdeck-max/sim/test_offline_it.cpp).
build_src_filter = +<*> -<.git/> -<.svn/> -<offline_it/quartznet.cpp>
; No try/catch anywhere in src/: drop the unwind tables of our own code (an exception already ends in terminate).
build_src_flags = -fno-exceptions
lib_deps =
 adafruit/Adafruit GFX Library @ 1.11.11
 adafruit/Adafruit BusIO @ 1.17.0
 zinggjm/GxEPD2 @ 1.5.5
 adafruit/Adafruit TCA8418 @ ^1.0.2
 lewisxhe/XPowersLib @ ^0.3.0
monitor_speed = 115200

[env:mattermesh]
extends = ui_hardware
lib_deps =
 ${ui_hardware.lib_deps}
 symlink://lib/mattermesh-core
 symlink://lib/mattermesh-ed25519
 jgromes/RadioLib @ 7.8.1
 rweather/Crypto @ 0.4.0
 densaugeo/base64 @ 1.4.0
 bblanchon/ArduinoJson @ 6.21.5
 https://github.com/ElectronicCats/CayenneLPP.git#1.5.0
 h2zero/NimBLE-Arduino @ 2.3.6
 bitbank2/PNGdec @ 1.1.6
 mikalhart/TinyGPSPlus @ 1.1.0
 earlephilhower/ESP8266Audio @ 2.0.0
build_flags =
 ${ui_hardware.build_flags}
 -D RADIOLIB_STATIC_ONLY=1
 -D RADIOLIB_GODMODE=1
 -I meshcore-base/lib/ed25519
 -D USE_SX1262
 ; USA MeshCore preset (src/mesh/radio_presets.h): 915 MHz ISM band, FCC Part 15.247.
 -D LORA_SF=7
 -D LORA_FREQ=910.525
 -D LORA_BW=62.5
 -D LORA_CR=5
 -D LORA_TX_POWER=22
 -D MAX_GROUP_CHANNELS=32
 -D MAX_CONTACTS=1024
 ; BLE is a peripheral only (Device Information service): no central/observer roles.
 -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
 -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
 ; PNGdec's zlib checks one CRC per tile: the 1 KB table instead of the 8 KB BYFOUR ones.
 -D NOBYFOUR
 ; Only the SX1262 driver is used.
 -D RADIOLIB_EXCLUDE_CC1101=1 -D RADIOLIB_EXCLUDE_NRF24=1 -D RADIOLIB_EXCLUDE_RF69=1 -D RADIOLIB_EXCLUDE_SX1231=1 -D RADIOLIB_EXCLUDE_SI443X=1 -D RADIOLIB_EXCLUDE_RFM2X=1 -D RADIOLIB_EXCLUDE_SX127X=1 -D RADIOLIB_EXCLUDE_STM32WLX=1 -D RADIOLIB_EXCLUDE_SX128X=1 -D RADIOLIB_EXCLUDE_LR11X0=1
 -D RADIOLIB_EXCLUDE_AFSK=1 -D RADIOLIB_EXCLUDE_AX25=1 -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1 -D RADIOLIB_EXCLUDE_MORSE=1 -D RADIOLIB_EXCLUDE_RTTY=1 -D RADIOLIB_EXCLUDE_SSTV=1 -D RADIOLIB_EXCLUDE_BELL=1 -D RADIOLIB_EXCLUDE_APRS=1 -D RADIOLIB_EXCLUDE_LORAWAN=1 -D RADIOLIB_EXCLUDE_FSK4=1 -D RADIOLIB_EXCLUDE_PAGER=1

; T-Deck Pro MVP image: core mesh chat, GPS, battery, keyboard, touch and e-paper UI. Audio/dictation and the
; vibration motor use hardware this port has not been wired up for yet (see src/services/audio.* and
; src/board/pro_board.h); the haptic motor itself runs on a plain PWM pin and does work.
[env:mattermesh-free]
extends = env:mattermesh
